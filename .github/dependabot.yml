# Dependabot version updates. Security alerts and security PRs are managed separately in repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:30"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
